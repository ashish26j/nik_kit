server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the web experience.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Django app container (same-origin → no CORS needed).
    location /api/ {
        proxy_pass http://app:6061;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
